<path class="ln" d="M290,185 H348"/><text x="296" y="178" class="l">HTTPS</text>
<path class="dl" d="M290,305 H320 V200 H348"/>
<path class="ln" d="M165,140 V124 H775 V138"/><text x="420" y="134" class="l" fill="#1d4ed8">Sign in</text>
