<path class="ln" d="M1120,515 L1218,375"/><text x="1150" y="438" class="l">create call</text>
<path class="dl" d="M1218,430 L1122,560"/><text x="1128" y="600" class="l" transform="rotate(-54 1128 600)">webhooks, tools</text>
<path class="ln" d="M1120,630 L1218,580"/><text x="1140" y="640" class="l">Verify SMS</text>
<path class="ln" d="M1390,452 V498" marker-start="url(#a)"/><text x="1400" y="480" class="l">SIP</text>
<path class="ln" d="M1390,632 V698" marker-start="url(#a)"/><text x="1400" y="670" class="l">phone network</text>
<path class="ln" d="M1000,650 V842 H440 V858"/>
<path class="ln" d="M640,842 V858"/><path class="ln" d="M840,842 V858"/><path class="ln" d="M1050,842 V858"/>
