<rect x="40" y="1040" width="16" height="16" rx="3" class="u"/><text x="64" y="1053" class="s">You</text>
<rect x="120" y="1040" width="16" height="16" rx="3" class="w"/><text x="144" y="1053" class="s">AWS</text>
<rect x="200" y="1040" width="16" height="16" rx="3" class="x"/><text x="224" y="1053" class="s">Third-party service</text>
